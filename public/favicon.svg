<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Sophisticated champagne gold gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C3A5" />
      <stop offset="35%" stop-color="#C5A880" />
      <stop offset="70%" stop-color="#A88D65" />
      <stop offset="100%" stop-color="#7C674A" />
    </linearGradient>
  </defs>
  
  <!-- Outer luxury gallery seals -->
  <circle cx="256" cy="256" r="236" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="16 8" opacity="0.4" />
  <circle cx="256" cy="256" r="216" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />
  
  <!-- Stylized G (Vonder Gray) -->
  <path d="M 335 190 
           C 310 135, 240 120, 185 150 
           C 120 185, 105 275, 145 340 
           C 180 395, 260 415, 320 375 
           C 365 345, 380 295, 375 245
           L 270 245" 
        stroke="url(#goldGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Intertwining Stylized V -->
  <path d="M 180 180 
           L 270 360
           L 360 180" 
        stroke="url(#goldGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>